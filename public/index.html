<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>선택 뒷봉 현황</title>
  <style>
    :root {
      --bg: #0f1412;
      --bg-accent-1: #163528;
      --bg-accent-2: #1a2433;
      --card: #1a2220;
      --text: #e8eee9;
      --muted: #9aada3;
      --available: #3ecf8e;
      --available-bg: #1a3d2e;
      --busy: #f0a35a;
      --busy-bg: #3d2a16;
      --border: #2d3a34;
      --reset: #6b7c8a;
      --memo-bg: #141b19;
      --input-bg: #121816;
      --count-btn: #2a3530;
      --focus: #2f6b4f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(circle at top left, var(--bg-accent-1), transparent 42%),
        radial-gradient(circle at bottom right, var(--bg-accent-2), transparent 38%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 12px 48px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    .summary-boxes {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .total-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }

    .total-label {
      color: var(--muted);
      font-size: 0.92rem;
      flex-shrink: 0;
    }

    .total-side {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .total-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--available);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .total-edit-row {
      width: 100%;
      max-width: 220px;
      margin-left: auto;
    }

    .chaesu-input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      background: var(--input-bg);
    }

    .chaesu-input:focus {
      outline: 2px solid var(--focus);
      border-color: var(--available);
    }

    button.summary-btn {
      width: auto;
      min-width: 72px;
      padding: 7px 10px;
      font-size: 0.8rem;
      background: #334155;
      color: #fff;
    }

    .total-side .count-controls {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .sub {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .name-row .name-text {
      flex: 1;
      min-width: 0;
    }

    .name-text {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.3;
      word-break: keep-all;
      background: var(--memo-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      min-height: 34px;
    }

    .name-input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--text);
      background: var(--input-bg);
    }

    .name-input:focus {
      outline: 2px solid var(--focus);
      border-color: var(--available);
    }

    button.name-save,
    button.name-edit {
      width: auto;
      min-width: 72px;
      padding: 7px 10px;
      font-size: 0.8rem;
      background: #334155;
      color: #fff;
    }

    .badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      width: fit-content;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge.available {
      color: var(--available);
      background: var(--available-bg);
    }

    .badge.busy {
      color: var(--busy);
      background: var(--busy-bg);
    }

    .elapsed {
      margin-left: auto;
      font-weight: 700;
      color: var(--busy);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-height: 1.2em;
      color: var(--muted);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .count-box {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .count-box .count {
      font-weight: 600;
      color: var(--text);
      text-align: right;
      white-space: nowrap;
      font-size: 0.82rem;
    }

    .count-controls {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    button.count-btn {
      width: 28px;
      min-width: 28px;
      padding: 0;
      height: 28px;
      border-radius: 8px;
      background: var(--count-btn);
      color: var(--text);
      font-size: 1rem;
      line-height: 1;
      border: 1px solid var(--border);
    }

    .memo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .memo-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      color: var(--text);
      background: var(--input-bg);
    }

    .memo-input:focus {
      outline: 2px solid var(--focus);
      border-color: var(--available);
    }

    .memo-text {
      font-size: 0.85rem;
      line-height: 1.4;
      word-break: break-word;
      background: var(--memo-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 38px;
    }

    .memo-actions {
      display: flex;
      gap: 6px;
    }

    .item-actions {
      margin-top: auto;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    button.use {
      background: var(--available);
      color: #0b1a12;
    }

    button.return {
      background: var(--busy);
      color: #1a1208;
    }

    button.memo-save,
    button.memo-edit {
      background: #3b82f6;
      color: #fff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .error {
      margin-top: 12px;
      color: #f87171;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    @media (max-width: 720px) {
      .row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .name-input {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>선택 뒷봉 현황</h1>
    <p class="sub">항목을 눌러 상담시작·상담완료하세요. 화면은 자동으로 갱신됩니다.</p>
    <div class="summary-boxes" id="summaryBoxes"></div>
    <div class="rows" id="list"></div>
    <p class="error" id="error"></p>
    <p class="footer">상태 저장소: 서버 메모리 (재시작 시 초기화될 수 있음) · 메모 최대 100자</p>
  </main>

  <script>
    const listEl = document.getElementById('list');
    const summaryBoxesEl = document.getElementById('summaryBoxes');
    const errorEl = document.getElementById('error');
    let busy = false;
    let prevStatuses = null;
    let state = null;
    const draftMemos = {};
    const draftNames = {};
    const editingNames = new Set();
    const editingMemos = new Set();
    let isEditingChaesu = false;
    const timerAnchors = {};
    let draftChaesuCount = null;

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function isAvailable(status) {
      return status === '상담가능';
    }

    function isBusyStatus(status) {
      return status === '상담중';
    }

    function formatElapsed(ms) {
      const totalSec = ms <= 0 ? 0 : Math.max(1, Math.ceil(ms / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (h > 0) {
        return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function getTimerStart(id, item) {
      if (timerAnchors[id]) return timerAnchors[id];
      return item.startedAt;
    }

    function syncTimerAnchors(items) {
      Object.keys(items).forEach((id) => {
        const item = items[id];
        if (!isBusyStatus(item.status)) {
          delete timerAnchors[id];
          return;
        }
        if (!timerAnchors[id] && item.startedAt) {
          timerAnchors[id] = item.startedAt;
        }
      });
    }

    function vibrateOnComplete(nextItems) {
      if (!prevStatuses || !nextItems) return;
      const completed = Object.keys(nextItems).some((id) => {
        const prev = prevStatuses[id];
        const next = nextItems[id]?.status;
        return isBusyStatus(prev) && isAvailable(next);
      });
      if (completed && navigator.vibrate) {
        navigator.vibrate(200);
      }
    }

    function rememberStatuses(items) {
      prevStatuses = Object.fromEntries(
        Object.entries(items).map(([id, item]) => [id, item.status])
      );
    }

    function syncNameDraft(input) {
      if (!input) return;
      draftNames[input.dataset.id] = input.value;
    }

    function getNameInputForButton(btn) {
      return btn.closest('.name-row')?.querySelector('.name-input') ?? null;
    }

    function hasSavedName(item) {
      return Boolean(item.name && item.name.trim());
    }

    function getMemoInputForButton(btn) {
      return btn.closest('.memo')?.querySelector('.memo-input') ?? null;
    }

    function syncMemoDraft(input) {
      if (!input) return;
      draftMemos[input.dataset.id] = input.value;
    }

    function readNameValue(id, input) {
      const value = (input?.value ?? draftNames[id] ?? '').trim();
      if (value) {
        draftNames[id] = value;
      }
      return value;
    }

    function hasSavedMemo(item) {
      return Boolean(item.memo && item.memo.trim());
    }

    function readMemoValue(id, input) {
      const value = (input?.value ?? draftMemos[id] ?? '').trim();
      if (value) {
        draftMemos[id] = value;
      }
      return value;
    }

    function hasSavedChaesu(global) {
      return global && global.chaesuCount !== null && global.chaesuCount !== undefined;
    }

    function readChaesuValue(input) {
      const value = (input?.value ?? draftChaesuCount ?? '').trim();
      if (value) {
        draftChaesuCount = value;
      }
      return value;
    }

    function renderSummary() {
      if (!state?.global) return;
      const global = state.global;
      const hasChaesu = hasSavedChaesu(global);
      const showChaesuEdit = isEditingChaesu || !hasChaesu;
      const chaesuButtonLabel = hasChaesu ? '인원변경' : '인원입력';
      const active = document.activeElement;
      const focusedChaesu = active?.classList.contains('chaesu-input');
      const chaesuDraft = focusedChaesu
        ? active.value
        : (draftChaesuCount ?? (hasChaesu ? String(global.chaesuCount) : ''));

      let chaesuSideHtml = '';
      if (showChaesuEdit) {
        chaesuSideHtml = `
          <div class="total-side total-edit-row">
            <input
              class="chaesu-input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="인원"
              value="${escapeHtml(chaesuDraft)}"
            />
            <button type="button" class="summary-btn" data-scope="global" data-action="chaesu-save">${chaesuButtonLabel}</button>
          </div>
        `;
      } else {
        chaesuSideHtml = `
          <div class="total-side">
            <span class="total-value">${global.chaesuCount}명</span>
            <button type="button" class="summary-btn" data-scope="global" data-action="chaesu-edit">인원변경</button>
          </div>
        `;
      }

      summaryBoxesEl.innerHTML = `
        <div class="total-box">
          <span class="total-label">차수 총인원</span>
          ${chaesuSideHtml}
        </div>
        <div class="total-box">
          <span class="total-label">총 완료인원</span>
          <div class="total-side">
            <span class="total-value">${state.totalCount ?? 0}명</span>
            <div class="count-controls">
              <button type="button" class="count-btn" data-scope="global" data-action="completed-down" aria-label="인원 감소">−</button>
              <button type="button" class="count-btn" data-scope="global" data-action="completed-up" aria-label="인원 증가">+</button>
            </div>
          </div>
        </div>
      `;

      if (focusedChaesu) {
        const input = summaryBoxesEl.querySelector('.chaesu-input');
        if (input) {
          input.focus();
          const len = input.value.length;
          input.setSelectionRange(len, len);
        }
      }
    }

    function applyState(next) {
      vibrateOnComplete(next.items);
      syncTimerAnchors(next.items);
      rememberStatuses(next.items);
      state = next;
      renderSummary();
      render();
    }

    function render() {
      if (!state) return;
      const now = Date.now();
      const memoMax = state.memoMax || 100;
      const nameMax = state.nameMax || 30;
      const active = document.activeElement;
      const focusedMemoId =
        active && active.classList.contains('memo-input')
          ? active.getAttribute('data-id')
          : null;
      const focusedNameId =
        active && active.classList.contains('name-input')
          ? active.getAttribute('data-id')
          : null;
      const focusedMemoValue = focusedMemoId ? active.value : null;
      const focusedNameValue = focusedNameId ? active.value : null;

      listEl.innerHTML = '';

      state.rows.forEach((rowIds) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'row';

        rowIds.forEach((id) => {
          const item = state.items[id];
          if (!item) return;
          const available = isAvailable(item.status);
          const card = document.createElement('div');
          card.className = 'item';
          const hasName = hasSavedName(item);
          const isEditingName = editingNames.has(id) || !hasName;
          const nameDraft = focusedNameId === id ? focusedNameValue : (draftNames[id] ?? item.name);
          const nameButtonLabel = hasName ? '이름변경' : '이름입력';

          let nameHtml = '';
          if (hasName && !isEditingName) {
            nameHtml = `
              <div class="name-row">
                <div class="name-text">${escapeHtml(item.name)}</div>
                <button type="button" class="name-edit" data-id="${escapeHtml(id)}" data-action="name-edit">이름변경</button>
              </div>
            `;
          } else {
            nameHtml = `
              <div class="name-row">
                <input
                  class="name-input"
                  type="text"
                  maxlength="${nameMax}"
                  placeholder="이름 ${nameMax}자"
                  data-id="${escapeHtml(id)}"
                  value="${escapeHtml(nameDraft)}"
                />
                <button type="button" class="name-save" data-id="${escapeHtml(id)}" data-action="name-save">${nameButtonLabel}</button>
              </div>
            `;
          }

          let elapsedHtml = '';
          const timerStart = getTimerStart(id, item);
          if (!available && timerStart) {
            elapsedHtml = `<span class="elapsed" data-elapsed-id="${escapeHtml(id)}">${formatElapsed(now - timerStart)}</span>`;
          }

          const statsHtml = `
            <div class="stats">
              <div class="count-box">
                <span class="count">상담완료 : ${item.count}명</span>
                <div class="count-controls">
                  <button type="button" class="count-btn" data-id="${escapeHtml(id)}" data-action="count-down" aria-label="인원 감소">−</button>
                  <button type="button" class="count-btn" data-id="${escapeHtml(id)}" data-action="count-up" aria-label="인원 증가">+</button>
                </div>
              </div>
            </div>
          `;

          const hasMemo = hasSavedMemo(item);
          const isEditingMemo = editingMemos.has(id) || !hasMemo;
          const memoButtonLabel = hasMemo ? '메모변경' : '메모입력';
          let memoHtml = '';
          if (hasMemo && !isEditingMemo) {
            memoHtml = `
              <div class="memo">
                <div class="memo-text">${escapeHtml(item.memo)}</div>
                <div class="memo-actions">
                  <button type="button" class="memo-edit" data-id="${escapeHtml(id)}" data-action="memo-edit">메모변경</button>
                </div>
              </div>
            `;
          } else {
            const draft = focusedMemoId === id ? focusedMemoValue : (draftMemos[id] ?? item.memo);
            memoHtml = `
              <div class="memo">
                <input
                  class="memo-input"
                  type="text"
                  maxlength="${memoMax}"
                  placeholder="메모 ${memoMax}자"
                  data-id="${escapeHtml(id)}"
                  value="${escapeHtml(draft)}"
                />
                <div class="memo-actions">
                  <button type="button" class="memo-save" data-id="${escapeHtml(id)}" data-action="memo-save">${memoButtonLabel}</button>
                </div>
              </div>
            `;
          }

          card.innerHTML = `
            ${nameHtml}
            <div class="badge-row">
              <span class="badge ${available ? 'available' : 'busy'}">${escapeHtml(item.status)}</span>
              ${elapsedHtml}
            </div>
            ${statsHtml}
            ${memoHtml}
            <div class="item-actions">
              <button type="button" class="${available ? 'use' : 'return'}" data-id="${escapeHtml(id)}" data-action="${available ? 'use' : 'return'}">
                ${available ? '상담시작' : '상담완료'}
              </button>
            </div>
          `;
          rowEl.appendChild(card);
        });

        listEl.appendChild(rowEl);
      });

      if (focusedMemoId) {
        const input = listEl.querySelector(`.memo-input[data-id="${CSS.escape(focusedMemoId)}"]`);
        if (input) {
          input.focus();
          const len = input.value.length;
          input.setSelectionRange(len, len);
        }
      } else if (focusedNameId) {
        const input = listEl.querySelector(`.name-input[data-id="${CSS.escape(focusedNameId)}"]`);
        if (input) {
          input.focus();
          const len = input.value.length;
          input.setSelectionRange(len, len);
        }
      }
    }

    async function load() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        applyState(data);
        errorEl.textContent = '';
      } catch (e) {
        errorEl.textContent = '상태를 불러오지 못했습니다.';
      }
    }

    async function globalAct(path, body, meta = {}) {
      if (busy) return;
      busy = true;
      errorEl.textContent = '';
      try {
        const res = await fetch(`/api/global/${path}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || '요청에 실패했습니다.';
          if (data.global) applyState(data);
          return;
        }
        if (path === 'chaesu-count') {
          draftChaesuCount = null;
          isEditingChaesu = false;
          alert(meta.hadChaesu ? '인원이 변경되었습니다.' : '인원이 입력되었습니다.');
        }
        applyState(data);
      } catch (e) {
        errorEl.textContent = '요청에 실패했습니다.';
      } finally {
        busy = false;
      }
    }

    async function act(id, action, body, meta = {}) {
      if (busy) return;
      busy = true;
      errorEl.textContent = '';
      try {
        const res = await fetch(`/api/items/${encodeURIComponent(id)}/${action}`, {
          method: 'POST',
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || '요청에 실패했습니다.';
          if (data.items) applyState(data);
          return;
        }
        if (action === 'memo') {
          delete draftMemos[id];
          editingMemos.delete(id);
          alert(meta.hadMemo ? '메모가 변경되었습니다.' : '메모가 입력되었습니다.');
        }
        if (action === 'memo/reset') {
          delete draftMemos[id];
          editingMemos.delete(id);
        }
        if (action === 'name') {
          delete draftNames[id];
          editingNames.delete(id);
          alert(meta.hadName ? '이름이 변경되었습니다.' : '이름이 입력되었습니다.');
        }
        if (action === 'use') {
          timerAnchors[id] = Date.now();
        }
        applyState(data);
      } catch (e) {
        errorEl.textContent = '요청에 실패했습니다.';
      } finally {
        busy = false;
      }
    }

    summaryBoxesEl.addEventListener('input', (e) => {
      const input = e.target.closest('.chaesu-input');
      if (input) {
        draftChaesuCount = input.value;
      }
    });

    summaryBoxesEl.addEventListener('pointerdown', (e) => {
      const btn = e.target.closest('button[data-action="chaesu-save"]');
      if (!btn) return;
      const input = summaryBoxesEl.querySelector('.chaesu-input');
      if (input) {
        draftChaesuCount = input.value;
      }
    });

    summaryBoxesEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-scope="global"]');
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === 'chaesu-edit') {
        isEditingChaesu = true;
        renderSummary();
        return;
      }
      if (action === 'chaesu-save') {
        const input = summaryBoxesEl.querySelector('.chaesu-input');
        const count = readChaesuValue(input);
        if (!count) {
          errorEl.textContent = '인원을 입력해 주세요.';
          return;
        }
        if (!/^\d+$/.test(count)) {
          errorEl.textContent = '인원은 0 이상의 숫자만 입력할 수 있습니다.';
          return;
        }
        const hadChaesu = hasSavedChaesu(state.global);
        globalAct('chaesu-count', { count }, { hadChaesu });
        return;
      }
      if (action === 'completed-up') {
        if (!confirm('인원 추가를 하시겠습니까?')) return;
        globalAct('completed/count', { delta: 1 });
        return;
      }
      if (action === 'completed-down') {
        if (!confirm('인원 차감을 하시겠습니까?')) return;
        globalAct('completed/count', { delta: -1 });
        return;
      }
    });

    listEl.addEventListener('input', (e) => {
      const memoInput = e.target.closest('.memo-input');
      if (memoInput) {
        syncMemoDraft(memoInput);
        return;
      }
      const nameInput = e.target.closest('.name-input');
      if (nameInput) {
        syncNameDraft(nameInput);
      }
    });

    listEl.addEventListener('compositionend', (e) => {
      const nameInput = e.target.closest('.name-input');
      if (nameInput) {
        syncNameDraft(nameInput);
        return;
      }
      const memoInput = e.target.closest('.memo-input');
      if (memoInput) {
        syncMemoDraft(memoInput);
      }
    });

    listEl.addEventListener('blur', (e) => {
      const nameInput = e.target.closest('.name-input');
      if (nameInput) {
        syncNameDraft(nameInput);
        return;
      }
      const memoInput = e.target.closest('.memo-input');
      if (memoInput) {
        syncMemoDraft(memoInput);
      }
    }, true);

    listEl.addEventListener('pointerdown', (e) => {
      const nameBtn = e.target.closest('button[data-action="name-save"]');
      if (nameBtn) {
        syncNameDraft(getNameInputForButton(nameBtn));
        return;
      }
      const memoBtn = e.target.closest('button[data-action="memo-save"]');
      if (memoBtn) {
        syncMemoDraft(getMemoInputForButton(memoBtn));
      }
    });

    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id][data-action]');
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;

      if (action === 'name-edit') {
        editingNames.add(id);
        render();
        return;
      }
      if (action === 'name-save') {
        const input = getNameInputForButton(btn);
        const name = readNameValue(id, input);
        if (!name) {
          errorEl.textContent = '이름을 입력해 주세요.';
          return;
        }
        const hadName = hasSavedName(state.items[id]);
        act(id, 'name', { name }, { hadName });
        return;
      }
      if (action === 'memo-edit') {
        editingMemos.add(id);
        render();
        return;
      }
      if (action === 'memo-save') {
        const input = getMemoInputForButton(btn);
        const text = readMemoValue(id, input);
        if (!text) {
          errorEl.textContent = '메모 내용을 입력해 주세요.';
          return;
        }
        const hadMemo = hasSavedMemo(state.items[id]);
        act(id, 'memo', { text }, { hadMemo });
        return;
      }
      if (action === 'count-up') {
        if (!confirm('인원 추가를 하시겠습니까?')) return;
        act(id, 'count', { delta: 1 });
        return;
      }
      if (action === 'count-down') {
        if (!confirm('인원 차감을 하시겠습니까?')) return;
        act(id, 'count', { delta: -1 });
        return;
      }
      if (action === 'use') {
        if (!confirm('상담을 시작하시겠습니까?')) return;
      }
      if (action === 'return') {
        if (!confirm('상담완료를 하시겠습니까?')) return;
      }
      act(id, action);
    });

    load();
    setInterval(load, 2000);
    setInterval(() => {
      if (!state) return;
      const now = Date.now();
      document.querySelectorAll('[data-elapsed-id]').forEach((el) => {
        const item = state.items[el.dataset.elapsedId];
        const timerStart = item ? getTimerStart(el.dataset.elapsedId, item) : null;
        if (timerStart && isBusyStatus(item.status)) {
          el.textContent = formatElapsed(now - timerStart);
        }
      });
    }, 1000);
  </script>
</body>
</html>
