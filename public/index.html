<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>선택 뒷봉 현황</title>
  <style>
    :root {
      --bg: #0f1412;
      --bg-accent-1: #163528;
      --bg-accent-2: #1a2433;
      --card: #1a2220;
      --text: #e8eee9;
      --muted: #9aada3;
      --available: #3ecf8e;
      --available-bg: #1a3d2e;
      --busy: #f0a35a;
      --busy-bg: #3d2a16;
      --border: #2d3a34;
      --reset: #6b7c8a;
      --memo-bg: #141b19;
      --input-bg: #121816;
      --count-btn: #2a3530;
      --focus: #2f6b4f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(circle at top left, var(--bg-accent-1), transparent 42%),
        radial-gradient(circle at bottom right, var(--bg-accent-2), transparent 38%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 12px 48px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    .sub {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .total-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }

    .total-label {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .total-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--available);
      font-variant-numeric: tabular-nums;
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
    }

    .name-row {
      display: flex;
      gap: 6px;
    }

    .name-input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--text);
      background: var(--input-bg);
    }

    .name-input:focus {
      outline: 2px solid var(--focus);
      border-color: var(--available);
    }

    button.name-save {
      width: auto;
      min-width: 64px;
      padding: 7px 10px;
      font-size: 0.8rem;
      background: #334155;
      color: #fff;
    }

    .badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      width: fit-content;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge.available {
      color: var(--available);
      background: var(--available-bg);
    }

    .badge.busy {
      color: var(--busy);
      background: var(--busy-bg);
    }

    .elapsed {
      margin-left: auto;
      font-weight: 700;
      color: var(--busy);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-height: 1.2em;
      color: var(--muted);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .count-box {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .count-box .count {
      font-weight: 600;
      color: var(--text);
      text-align: right;
      white-space: nowrap;
      font-size: 0.82rem;
    }

    .count-controls {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    button.count-btn {
      width: 28px;
      min-width: 28px;
      padding: 0;
      height: 28px;
      border-radius: 8px;
      background: var(--count-btn);
      color: var(--text);
      font-size: 1rem;
      line-height: 1;
      border: 1px solid var(--border);
    }

    .memo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .memo-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      color: var(--text);
      background: var(--input-bg);
    }

    .memo-input:focus {
      outline: 2px solid var(--focus);
      border-color: var(--available);
    }

    .memo-text {
      font-size: 0.85rem;
      line-height: 1.4;
      word-break: break-word;
      background: var(--memo-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 38px;
    }

    .memo-actions {
      display: flex;
      gap: 6px;
    }

    .item-actions {
      margin-top: auto;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    button.use {
      background: var(--available);
      color: #0b1a12;
    }

    button.return {
      background: var(--busy);
      color: #1a1208;
    }

    button.memo-save {
      background: #3b82f6;
      color: #fff;
    }

    button.memo-reset {
      background: var(--reset);
      color: #fff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .error {
      margin-top: 12px;
      color: #f87171;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    @media (max-width: 720px) {
      .row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .name-input {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>선택 뒷봉 현황</h1>
    <p class="sub">항목을 눌러 상담시작·상담완료하세요. 화면은 자동으로 갱신됩니다.</p>
    <div class="total-box">
      <span class="total-label">총 완료인원</span>
      <span class="total-value" id="totalCount">0명</span>
    </div>
    <div class="rows" id="list"></div>
    <p class="error" id="error"></p>
    <p class="footer">상태 저장소: 서버 메모리 (재시작 시 초기화될 수 있음) · 메모 최대 100자</p>
  </main>

  <script>
    const listEl = document.getElementById('list');
    const totalCountEl = document.getElementById('totalCount');
    const errorEl = document.getElementById('error');
    let busy = false;
    let prevStatuses = null;
    let state = null;
    const draftMemos = {};
    const draftNames = {};

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function isAvailable(status) {
      return status === '상담가능';
    }

    function isBusyStatus(status) {
      return status === '상담중';
    }

    function formatElapsed(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (h > 0) {
        return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function vibrateOnComplete(nextItems) {
      if (!prevStatuses || !nextItems) return;
      const completed = Object.keys(nextItems).some((id) => {
        const prev = prevStatuses[id];
        const next = nextItems[id]?.status;
        return isBusyStatus(prev) && isAvailable(next);
      });
      if (completed && navigator.vibrate) {
        navigator.vibrate(200);
      }
    }

    function rememberStatuses(items) {
      prevStatuses = Object.fromEntries(
        Object.entries(items).map(([id, item]) => [id, item.status])
      );
    }

    function applyState(next) {
      vibrateOnComplete(next.items);
      rememberStatuses(next.items);
      state = next;
      render();
    }

    function render() {
      if (!state) return;
      const now = Date.now();
      const memoMax = state.memoMax || 100;
      const nameMax = state.nameMax || 30;
      const active = document.activeElement;
      const focusedMemoId =
        active && active.classList.contains('memo-input')
          ? active.getAttribute('data-id')
          : null;
      const focusedNameId =
        active && active.classList.contains('name-input')
          ? active.getAttribute('data-id')
          : null;
      const focusedMemoValue = focusedMemoId ? active.value : null;
      const focusedNameValue = focusedNameId ? active.value : null;

      totalCountEl.textContent = `${state.totalCount ?? 0}명`;
      listEl.innerHTML = '';

      state.rows.forEach((rowIds) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'row';

        rowIds.forEach((id) => {
          const item = state.items[id];
          if (!item) return;
          const available = isAvailable(item.status);
          const card = document.createElement('div');
          card.className = 'item';
          const nameDraft = focusedNameId === id ? focusedNameValue : (draftNames[id] ?? item.name);

          let elapsedHtml = '';
          if (!available && item.startedAt) {
            elapsedHtml = `<span class="elapsed" data-elapsed-id="${escapeHtml(id)}">${formatElapsed(now - item.startedAt)}</span>`;
          }

          const statsHtml = `
            <div class="stats">
              <div class="count-box">
                <span class="count">상담완료 : ${item.count}명</span>
                <div class="count-controls">
                  <button type="button" class="count-btn" data-id="${escapeHtml(id)}" data-action="count-down" aria-label="인원 감소">−</button>
                  <button type="button" class="count-btn" data-id="${escapeHtml(id)}" data-action="count-up" aria-label="인원 증가">+</button>
                </div>
              </div>
            </div>
          `;

          const hasMemo = Boolean(item.memo && item.memo.trim());
          let memoHtml = '';
          if (hasMemo) {
            memoHtml = `
              <div class="memo">
                <div class="memo-text">${escapeHtml(item.memo)}</div>
                <div class="memo-actions">
                  <button type="button" class="memo-reset" data-id="${escapeHtml(id)}" data-action="memo-reset">메모리셋</button>
                </div>
              </div>
            `;
          } else {
            const draft = focusedMemoId === id ? focusedMemoValue : (draftMemos[id] ?? '');
            memoHtml = `
              <div class="memo">
                <input
                  class="memo-input"
                  type="text"
                  maxlength="${memoMax}"
                  placeholder="메모 ${memoMax}자"
                  data-id="${escapeHtml(id)}"
                  value="${escapeHtml(draft)}"
                />
                <div class="memo-actions">
                  <button type="button" class="memo-save" data-id="${escapeHtml(id)}" data-action="memo-save">메모입력</button>
                </div>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="name-row">
              <input
                class="name-input"
                type="text"
                maxlength="${nameMax}"
                data-id="${escapeHtml(id)}"
                value="${escapeHtml(nameDraft)}"
              />
              <button type="button" class="name-save" data-id="${escapeHtml(id)}" data-action="name-save">이름저장</button>
            </div>
            <div class="badge-row">
              <span class="badge ${available ? 'available' : 'busy'}">${escapeHtml(item.status)}</span>
              ${elapsedHtml}
            </div>
            ${statsHtml}
            ${memoHtml}
            <div class="item-actions">
              <button type="button" class="${available ? 'use' : 'return'}" data-id="${escapeHtml(id)}" data-action="${available ? 'use' : 'return'}">
                ${available ? '상담시작' : '상담완료'}
              </button>
            </div>
          `;
          rowEl.appendChild(card);
        });

        listEl.appendChild(rowEl);
      });

      if (focusedMemoId) {
        const input = listEl.querySelector(`.memo-input[data-id="${CSS.escape(focusedMemoId)}"]`);
        if (input) {
          input.focus();
          const len = input.value.length;
          input.setSelectionRange(len, len);
        }
      } else if (focusedNameId) {
        const input = listEl.querySelector(`.name-input[data-id="${CSS.escape(focusedNameId)}"]`);
        if (input) {
          input.focus();
          const len = input.value.length;
          input.setSelectionRange(len, len);
        }
      }
    }

    async function load() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        applyState(data);
        errorEl.textContent = '';
      } catch (e) {
        errorEl.textContent = '상태를 불러오지 못했습니다.';
      }
    }

    async function act(id, action, body) {
      if (busy) return;
      busy = true;
      errorEl.textContent = '';
      try {
        const res = await fetch(`/api/items/${encodeURIComponent(id)}/${action}`, {
          method: 'POST',
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || '요청에 실패했습니다.';
          if (data.items) applyState(data);
          return;
        }
        if (action === 'memo' || action === 'memo/reset') {
          delete draftMemos[id];
        }
        if (action === 'name') {
          delete draftNames[id];
        }
        applyState(data);
      } catch (e) {
        errorEl.textContent = '요청에 실패했습니다.';
      } finally {
        busy = false;
      }
    }

    listEl.addEventListener('input', (e) => {
      const memoInput = e.target.closest('.memo-input');
      if (memoInput) {
        draftMemos[memoInput.dataset.id] = memoInput.value;
        return;
      }
      const nameInput = e.target.closest('.name-input');
      if (nameInput) {
        draftNames[nameInput.dataset.id] = nameInput.value;
      }
    });

    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id][data-action]');
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;

      if (action === 'name-save') {
        const input = listEl.querySelector(`.name-input[data-id="${CSS.escape(id)}"]`);
        const name = (input?.value ?? draftNames[id] ?? '').trim();
        act(id, 'name', { name });
        return;
      }
      if (action === 'memo-save') {
        const input = listEl.querySelector(`.memo-input[data-id="${CSS.escape(id)}"]`);
        const text = (input?.value ?? draftMemos[id] ?? '').trim();
        act(id, 'memo', { text });
        return;
      }
      if (action === 'memo-reset') {
        if (!confirm('메모를 리셋하시겠습니까?')) return;
        act(id, 'memo/reset');
        return;
      }
      if (action === 'count-up') {
        if (!confirm('인원 추가를 하시겠습니까?')) return;
        act(id, 'count', { delta: 1 });
        return;
      }
      if (action === 'count-down') {
        if (!confirm('인원 차감을 하시겠습니까?')) return;
        act(id, 'count', { delta: -1 });
        return;
      }
      if (action === 'use') {
        if (!confirm('상담시작을 하시겠습니까?')) return;
      }
      if (action === 'return') {
        if (!confirm('상담완료를 하시겠습니까?')) return;
      }
      act(id, action);
    });

    load();
    setInterval(load, 2000);
    setInterval(() => {
      if (!state) return;
      const now = Date.now();
      document.querySelectorAll('[data-elapsed-id]').forEach((el) => {
        const item = state.items[el.dataset.elapsedId];
        if (item?.startedAt && isBusyStatus(item.status)) {
          el.textContent = formatElapsed(now - item.startedAt);
        }
      });
    }, 1000);
  </script>
</body>
</html>
