<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상담 현황</title>
  <style>
    :root {
      --bg: #f3f6f4;
      --card: #ffffff;
      --text: #1a2e24;
      --muted: #5f7368;
      --available: #1f7a4c;
      --available-bg: #e8f6ee;
      --busy: #b45309;
      --busy-bg: #fff4e5;
      --border: #d5e0da;
      --reset: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(circle at top left, #dff3e8, transparent 40%),
        radial-gradient(circle at bottom right, #e8eef5, transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 12px 48px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 180px;
    }

    .item-id {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      word-break: keep-all;
    }

    .badge {
      display: inline-block;
      width: fit-content;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge.available {
      color: var(--available);
      background: var(--available-bg);
    }

    .badge.busy {
      color: var(--busy);
      background: var(--busy-bg);
    }

    .stats {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-height: 1.2em;
      color: var(--muted);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .stats .elapsed {
      font-weight: 700;
      color: var(--busy);
    }

    .stats .count {
      margin-left: auto;
      font-weight: 600;
      color: var(--text);
      text-align: right;
      white-space: nowrap;
    }

    .memo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .memo-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      color: var(--text);
      background: #fff;
    }

    .memo-input:focus {
      outline: 2px solid #c7e6d4;
      border-color: var(--available);
    }

    .memo-text {
      font-size: 0.85rem;
      line-height: 1.4;
      word-break: break-word;
      background: #f7faf8;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 38px;
    }

    .memo-actions {
      display: flex;
      gap: 6px;
    }

    .item-actions {
      margin-top: auto;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    button.use {
      background: var(--available);
      color: #fff;
    }

    button.return {
      background: var(--busy);
      color: #fff;
    }

    button.memo-save {
      background: #2563eb;
      color: #fff;
    }

    button.memo-reset {
      background: var(--reset);
      color: #fff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .error {
      margin-top: 12px;
      color: #b91c1c;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    @media (max-width: 720px) {
      .row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .item-id {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>상담 현황</h1>
    <p class="sub">항목을 눌러 상담시작·상담완료하세요. 화면은 자동으로 갱신됩니다.</p>
    <div class="rows" id="list"></div>
    <p class="error" id="error"></p>
    <p class="footer">상태 저장소: 서버 메모리 (재시작 시 초기화될 수 있음) · 메모 최대 100자</p>
  </main>

  <script>
    const listEl = document.getElementById('list');
    const errorEl = document.getElementById('error');
    let busy = false;
    let prevStatuses = null;
    let state = null;
    const draftMemos = {};

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function isAvailable(status) {
      return status === '상담가능' || status === '고해가능';
    }

    function isBusyStatus(status) {
      return status === '상담중' || status === '고해중';
    }

    function formatElapsed(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (h > 0) {
        return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function vibrateOnComplete(nextItems) {
      if (!prevStatuses || !nextItems) return;
      const completed = Object.keys(nextItems).some((id) => {
        const prev = prevStatuses[id];
        const next = nextItems[id]?.status;
        return isBusyStatus(prev) && isAvailable(next);
      });
      if (completed && navigator.vibrate) {
        navigator.vibrate(200);
      }
    }

    function rememberStatuses(items) {
      prevStatuses = Object.fromEntries(
        Object.entries(items).map(([id, item]) => [id, item.status])
      );
    }

    function applyState(next) {
      vibrateOnComplete(next.items);
      rememberStatuses(next.items);
      state = next;
      render();
    }

    function render() {
      if (!state) return;
      const now = Date.now();
      const memoMax = state.memoMax || 100;
      const active = document.activeElement;
      const focusedMemoId =
        active && active.classList.contains('memo-input')
          ? active.getAttribute('data-id')
          : null;
      const focusedValue = focusedMemoId ? active.value : null;

      listEl.innerHTML = '';

      state.rows.forEach((rowIds) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'row';

        rowIds.forEach((id) => {
          const item = state.items[id];
          if (!item) return;
          const available = isAvailable(item.status);
          const card = document.createElement('div');
          card.className = 'item';

          let statsHtml = '';
          if (item.showTimer) {
            const parts = [];
            if (!available && item.startedAt) {
              parts.push(
                `<span class="elapsed" data-elapsed-id="${escapeHtml(id)}">${formatElapsed(now - item.startedAt)}</span>`
              );
            }
            parts.push(`<span class="count">상담완료 : ${item.count}명</span>`);
            statsHtml = `<div class="stats">${parts.join('')}</div>`;
          }

          const startLabel = item.showTimer ? '상담시작' : '고해시작';
          const endLabel = item.showTimer ? '상담완료' : '고해완료';
          const hasMemo = Boolean(item.memo && item.memo.trim());

          let memoHtml = '';
          if (hasMemo) {
            memoHtml = `
              <div class="memo">
                <div class="memo-text">${escapeHtml(item.memo)}</div>
                <div class="memo-actions">
                  <button type="button" class="memo-reset" data-id="${escapeHtml(id)}" data-action="memo-reset">리셋</button>
                </div>
              </div>
            `;
          } else {
            const draft = focusedMemoId === id ? focusedValue : (draftMemos[id] ?? '');
            memoHtml = `
              <div class="memo">
                <input
                  class="memo-input"
                  type="text"
                  maxlength="${memoMax}"
                  placeholder="메모 ${memoMax}자"
                  data-id="${escapeHtml(id)}"
                  value="${escapeHtml(draft)}"
                />
                <div class="memo-actions">
                  <button type="button" class="memo-save" data-id="${escapeHtml(id)}" data-action="memo-save">입력완료</button>
                </div>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="item-id">${escapeHtml(id)}</div>
            <span class="badge ${available ? 'available' : 'busy'}">${escapeHtml(item.status)}</span>
            ${statsHtml}
            ${memoHtml}
            <div class="item-actions">
              <button type="button" class="${available ? 'use' : 'return'}" data-id="${escapeHtml(id)}" data-action="${available ? 'use' : 'return'}">
                ${available ? startLabel : endLabel}
              </button>
            </div>
          `;
          rowEl.appendChild(card);
        });

        listEl.appendChild(rowEl);
      });

      if (focusedMemoId) {
        const input = listEl.querySelector(`.memo-input[data-id="${CSS.escape(focusedMemoId)}"]`);
        if (input) {
          input.focus();
          const len = input.value.length;
          input.setSelectionRange(len, len);
        }
      }
    }

    async function load() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        applyState(data);
        errorEl.textContent = '';
      } catch (e) {
        errorEl.textContent = '상태를 불러오지 못했습니다.';
      }
    }

    async function act(id, action, body) {
      if (busy) return;
      busy = true;
      errorEl.textContent = '';
      try {
        const res = await fetch(`/api/items/${encodeURIComponent(id)}/${action}`, {
          method: 'POST',
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || '요청에 실패했습니다.';
          if (data.items) applyState(data);
          return;
        }
        if (action === 'memo' || action === 'memo/reset') {
          delete draftMemos[id];
        }
        applyState(data);
      } catch (e) {
        errorEl.textContent = '요청에 실패했습니다.';
      } finally {
        busy = false;
      }
    }

    listEl.addEventListener('input', (e) => {
      const input = e.target.closest('.memo-input');
      if (!input) return;
      draftMemos[input.dataset.id] = input.value;
    });

    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id][data-action]');
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;

      if (action === 'memo-save') {
        const input = listEl.querySelector(`.memo-input[data-id="${CSS.escape(id)}"]`);
        const text = (input?.value ?? draftMemos[id] ?? '').trim();
        act(id, 'memo', { text });
        return;
      }
      if (action === 'memo-reset') {
        act(id, 'memo/reset');
        return;
      }
      act(id, action);
    });

    load();
    setInterval(load, 2000);
    setInterval(() => {
      if (!state) return;
      const now = Date.now();
      document.querySelectorAll('[data-elapsed-id]').forEach((el) => {
        const item = state.items[el.dataset.elapsedId];
        if (item?.startedAt && isBusyStatus(item.status)) {
          el.textContent = formatElapsed(now - item.startedAt);
        }
      });
    }, 1000);
  </script>
</body>
</html>
